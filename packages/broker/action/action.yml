name: VegaFactory token
description: Exchange this job's GitHub OIDC token for repository issues and organization-wide project access (1 hour).
author: VegaStack

# The calling job MUST request an OIDC token, or `core.getIDToken` has nothing to fetch:
#
#   permissions:
#     id-token: write
#     contents: read
#
# The broker derives the repository from the verified OIDC claims, so this action sends no body
# and there is no repository input to get wrong.

branding:
  icon: key
  color: purple

inputs:
  endpoint:
    description: The broker endpoint to exchange the OIDC token at.
    required: false
    default: https://vegafactory-token.vegastack.com/token
  audience:
    description: The OIDC audience the broker verifies.
    required: false
    default: vegastack-factory

outputs:
  token:
    description: An installation token for one repository's issues and organization-wide projects.
    value: ${{ steps.mint.outputs.token }}
  expires_at:
    description: The installation token's expiry reported by the broker.
    value: ${{ steps.mint.outputs.expires_at }}

runs:
  using: composite
  steps:
    - id: mint
      uses: actions/github-script@v8
      env:
        BROKER_ENDPOINT: ${{ inputs.endpoint }}
        BROKER_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const endpoint = process.env.BROKER_ENDPOINT
          const audience = process.env.BROKER_AUDIENCE
          try {
            const idToken = await core.getIDToken(audience)
            core.setSecret(idToken)
            const response = await fetch(endpoint, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(20000),
              headers: { authorization: `Bearer ${idToken}`, accept: 'application/json' },
            })
            if (!response.ok) {
              core.setFailed(`the token broker refused this request: HTTP ${response.status}`)
              return
            }
            const body = await response.json().catch(() => ({}))
            if (typeof body.token !== 'string' || !body.token || typeof body.expires_at !== 'string' ||
                !Number.isFinite(Date.parse(body.expires_at)) || Date.parse(body.expires_at) <= Date.now()) {
              core.setFailed('the token broker returned an unusable token response')
              return
            }
            // core.setSecret emits ::add-mask:: before either documented output is exposed.
            core.setSecret(body.token)
            core.setOutput('token', body.token)
            core.setOutput('expires_at', body.expires_at)
            core.info('minted a capped factory token')
          } catch {
            core.setFailed('the token broker exchange could not be completed')
          }
