name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (node 24)
    # Self-hosted while GitHub-hosted runners are billing-locked (#57): on
    # ubuntu-latest every job died in ~3s having recorded ZERO steps, because the
    # runner never picked it up — a permanently red check that stops gating
    # anything. Revert to `ubuntu-latest` together with release.yml's runner and
    # its --no-provenance flag, never one without the other, once #57 clears.
    #
    # Target: the two repo-level laptop runners (`vsk-runner-mac-mk-1/2`, label
    # `vsk-runners-mac`). The always-on Mac mini is the intended host and is not
    # registered yet (#119) — its org runner group is `vsk-runners-mac-mini`, its
    # runner account is a different macOS user from the dispatcher account so a CI
    # job cannot read the dispatcher's tokens, and provisioning is the control
    # room's `onboarding/dispatcher-box.md`. Switch to it — replacing the runs-on
    # line below with `runs-on:` / `  group: vsk-runners-mac-mini` — only once the
    # group is granted to this repository AND lists an online runner: this job is a
    # required status check, and an ungranted or empty group queues forever with
    # `runner: null` instead of failing, which would strand every PR.
    #
    # macOS means BSD userland. Audited before use: no `sed -i`, `date -d`,
    # `readlink -f`, `base64 -w`, `sort -V`, `grep -P` or `stat -c` anywhere in
    # this file, and `set -euo pipefail` is valid in macOS bash 3.2. The one real
    # hazard is the smoke test's target path — see the comment on TARGET_DIR.
    runs-on: [self-hosted, vsk-runners-mac]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Node 24 (LTS) is the single supported runtime: engines floor, CI, and release all match.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (validate:skill + test + lint + typecheck)
        run: bun run check

      - name: Build paired package inputs
        run: |
          set -euo pipefail
          bun run --cwd packages/dashboard build
          bun run --cwd packages/dashboard assemble
          bun run build

      - name: Pack and smoke descriptor-backed CI pair
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdtemp } from 'node:fs/promises'
          import { join } from 'node:path'
          import { assertPairVersions, command, packPair, smokePair } from './scripts/release-artifacts.mjs'
          const root = process.cwd()
          if (command(['git', 'status', '--porcelain', '--untracked-files=all'])) throw new Error('CI build changed source')
          const cli = JSON.parse(await readFile('packages/cli/package.json', 'utf8'))
          const dashboard = JSON.parse(await readFile('packages/dashboard/package.json', 'utf8'))
          assertPairVersions({ cli: cli.version, dashboard: dashboard.version, tag: `v${cli.version}` })
          const directory = await mkdtemp(join(process.env.RUNNER_TEMP, 'vegafactory-pair-'))
          const manifest = await packPair(root, directory, {
            sourceSha: command(['git', 'rev-parse', 'HEAD']),
            treeSha: command(['git', 'rev-parse', 'HEAD^{tree}']),
            version: cli.version,
            toolchain: {
              node: process.version, npm: command(['npm', '--version']),
              bun: command(['bun', '--version']), platform: process.platform, arch: process.arch,
            },
            checkEvidence: { ok: false, reason: 'CI packaging rehearsal; no release check evidence captured' },
            scanEvidence: { ok: false, reason: 'Release scanner has not run for this CI pair' },
          })
          manifest.platformMatrix.push(await smokePair(manifest, directory))
          await writeFile(join(directory, 'release-manifest.json'), JSON.stringify(manifest, null, 2) + '\n')
          console.log(JSON.stringify({ directory, artifacts: manifest.artifacts, platformMatrix: manifest.platformMatrix }, null, 2))
          NODE
