name: CI

# Each check runs in exactly one place:
#   pull_request → fast checks + only the tests the change affects
#   merge_group  → the full suite, build and pack smoke, once, on main + this PR
# Nothing runs after merge: the merge queue already tested exactly what lands.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The job name is the required status check; keep it stable.
    name: check (node 24)
    # Hosted runners only: a pull request can change any workflow file, so this public repo's
    # PR and merge-queue code never runs on the self-hosted Mac mini. Fork workflow runs also
    # need a maintainer's approval (repository setting).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests create throwaway git repositories; hosted runners have no commit identity.
      - name: Git identity for test repositories
        run: |
          git config --global user.name "vegafactory-ci"
          git config --global user.email "ci@vegafactory.invalid"
          git config --global init.defaultBranch main

      - name: Fast checks
        run: bun run check:fast

      - name: Affected tests
        if: github.event_name == 'pull_request'
        run: node tooling/test-affected.mjs --base "origin/${{ github.base_ref }}"

      - name: Full test suite
        if: github.event_name == 'merge_group'
        run: bun run test

      - name: Pack and smoke the package
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          node scripts/release.mjs pack "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node scripts/release.mjs smoke "$(node -p "require(process.env.RUNNER_TEMP + '/pack.json').tarball")"
