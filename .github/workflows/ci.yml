name: CI

# Each check runs in exactly one place:
#   pull_request → fast checks + only the tests the change affects
#   merge_group  → the full suite, build, pack smoke and skill scan, once, on main + this PR
# Nothing runs after merge: the merge queue already tested exactly what lands.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The job name is the required status check; keep it stable.
    name: check (node 24)
    # Hosted runners only: a pull request can change any workflow file, so this public repo's
    # PR and merge-queue code never runs on the self-hosted Mac mini. Fork workflow runs also
    # need a maintainer's approval (repository setting).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests create throwaway git repositories; hosted runners have no commit identity.
      - name: Git identity for test repositories
        run: |
          git config --global user.name "vegafactory-ci"
          git config --global user.email "ci@vegafactory.invalid"
          git config --global init.defaultBranch main

      - name: Fast checks
        run: bun run check:fast

      - name: Affected tests
        if: github.event_name == 'pull_request'
        run: node tooling/test-affected.mjs --base "origin/${{ github.base_ref }}"

      - name: Full test suite
        if: github.event_name == 'merge_group'
        run: bun run test

      - name: Verify release version authority
        if: github.event_name == 'merge_group'
        run: node scripts/release-artifacts.mjs verify-version-transition

      - name: Build paired package inputs
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          bun run --cwd packages/dashboard build
          bun run --cwd packages/dashboard assemble
          bun run build

      - name: Pack and smoke the package pair
        if: github.event_name == 'merge_group'
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdtemp } from 'node:fs/promises'
          import { join } from 'node:path'
          import { assertPairVersions, command, packPair, smokePair } from './scripts/release-artifacts.mjs'
          const root = process.cwd()
          if (command(['git', 'status', '--porcelain', '--untracked-files=all'])) throw new Error('CI build changed source')
          const cli = JSON.parse(await readFile('packages/cli/package.json', 'utf8'))
          const dashboard = JSON.parse(await readFile('packages/dashboard/package.json', 'utf8'))
          assertPairVersions({ cli: cli.version, dashboard: dashboard.version, tag: `v${cli.version}` })
          const directory = await mkdtemp(join(process.env.RUNNER_TEMP, 'vegafactory-pair-'))
          const manifest = await packPair(root, directory, {
            sourceSha: command(['git', 'rev-parse', 'HEAD']),
            treeSha: command(['git', 'rev-parse', 'HEAD^{tree}']),
            version: cli.version,
            toolchain: {
              node: process.version, npm: command(['npm', '--version']),
              bun: command(['bun', '--version']), platform: process.platform, arch: process.arch,
            },
            checkEvidence: { ok: false, reason: 'CI packaging rehearsal; no release check evidence captured' },
            scanEvidence: { ok: false, reason: 'Release scanner has not run for this CI pair' },
          })
          manifest.platformMatrix.push(await smokePair(manifest, directory))
          await writeFile(join(directory, 'release-manifest.json'), JSON.stringify(manifest, null, 2) + '\n')
          console.log(JSON.stringify({ directory, artifacts: manifest.artifacts, platformMatrix: manifest.platformMatrix }, null, 2))
          NODE

      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'merge_group'

      - name: Install pinned skill scanner
        if: github.event_name == 'merge_group'
        # SkillSpector v2.11.2 immutable commit 69dcdfb74487d361ba4c811d088cfdea2ff3a9dc, hash-locked dependencies.
        run: |
          set -euo pipefail
          SCANNER="$RUNNER_TEMP/skill-scanner"
          uv venv --python 3.12 "$SCANNER/venv"
          grep -v '^skillspector @' .github/skillspector-release-constraints.txt > "$SCANNER/dependencies.txt"
          uv pip sync --python "$SCANNER/venv/bin/python" --require-hashes "$SCANNER/dependencies.txt"
          uv pip install --python "$SCANNER/venv/bin/python" --no-deps --no-build-isolation 'git+https://github.com/NVIDIA/skillspector.git@69dcdfb74487d361ba4c811d088cfdea2ff3a9dc'
          echo "$SCANNER/venv/bin" >> "$GITHUB_PATH"

      - name: Scan the built skills
        if: github.event_name == 'merge_group'
        run: node skills/skills-tooling/skill-scan/scripts/skill-scan.mjs --json --no-provision
