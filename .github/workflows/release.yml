# Tag-triggered release of @vegastack/vegafactory. The tag is an operator-authorized ship action.
# The merge queue already ran the full suite on this exact commit, so this only builds, packs,
# smokes and publishes. A failed release rolls forward under a new patch version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: vegafactory-release
  cancel-in-progress: false

jobs:
  release:
    # npm trusted publishing (OIDC) runs only on GitHub-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag and changelog
        run: node scripts/release.mjs check-tag "$GITHUB_REF_NAME"

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p work/release
          node scripts/release.mjs pack work/release > work/release/pack.json
          echo "tarball=$(node -p "require('./work/release/pack.json').tarball")" >> "$GITHUB_OUTPUT"

      - name: Smoke the packed tarball
        run: node scripts/release.mjs smoke "${{ steps.pack.outputs.tarball }}"

      - name: Publish with provenance
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public

      - name: Wait for the registry and smoke the published version
        run: node scripts/release.mjs wait-registry

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.mjs notes work/release/notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file work/release/notes.md --verify-tag
