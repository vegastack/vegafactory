# Immutable paired releases. A release tag is an operator-authorized ship action.
# Preparation is self-hosted; publication and GitHub Release creation are hosted.
# A tag gets one executable attempt. Any failure rolls forward under a fresh patch tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# All versions share this boundary; local live publishing refuses.
concurrency:
  group: vegafactory-paired-release
  cancel-in-progress: false

jobs:
  prepare:
    # CI and release preparation are both disk-heavy and the two laptop runners
    # share one volume. Queue every job instead of racing or replacing one.
    concurrency:
      group: vegafactory-self-hosted-heavy
      queue: max
    permissions:
      contents: read
    outputs:
      pair-name: release-pair-${{ github.sha }}-attempt-${{ github.run_attempt }}
      pair-id: ${{ steps.retained.outputs.artifact-id }}
    # TEMPORARY (0.16.1, as for 0.14.0 and 0.16.0): GitHub-hosted runners are suspended by an
    # account-level billing lock — hosted jobs complete with zero steps executed, never having
    # started ("The job was not started because your account is locked due to a billing issue",
    # re-confirmed on a fresh run 01-09-2026). Self-hosted minutes are unmetered and do dispatch.
    #
    # Targets the repo-level macOS runners registered on the operator's machine
    # (`vsk-runner-mac-mk-1/2`, label `vsk-runners-mac`). The always-on Mac mini is the intended
    # host and is not registered yet (#119): its org runner group is `vsk-runners-mac-mini`, its
    # runner account is a different macOS user from the dispatcher account, and provisioning is
    # the control room's `onboarding/dispatcher-box.md`. Until the operator grants that group to
    # this repository and it lists an online runner, it is not reachable from here — a probe on
    # 01-09-2026 left all three org label sets queued indefinitely with `runner: null`, which is
    # how a missing runner-group grant presents (it queues forever rather than erroring). This
    # job prepares and retains bytes only; the publication jobs below already use hosted runners.
    #
    # macOS means BSD userland, which the steps below were not written for. Audited before use:
    # the changelog-extraction `awk` is pure POSIX, `grep -q '[^[:space:]]'` uses a POSIX class,
    # and there is no `sed -i`, `date -d`, `readlink -f`, `base64 -w` or `sort -V` anywhere.
    # Move this preparation job to `ubuntu-latest` once the lock clears (#57).
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      - name: Refuse same-run release reruns
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { recoveryDecision } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-artifacts.mjs`)
            recoveryDecision({ runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) })

      # A v0.2.0 tag on a tree whose package.json still says 0.1.0 must fail here,
      # not publish the wrong version.
      - name: Verify both packages carry the tag version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          DASH_VERSION=$(node -p "require('./packages/dashboard/package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $PKG_VERSION"
            exit 1
          fi
          # `vegafactory dashboard` fetches @vegastack/vegafactory-dashboard at the CLI's own
          # version. Publishing a CLI whose dashboard version differs would ship a verb whose
          # first-use fetch resolves nothing.
          if [ "$DASH_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::packages/dashboard is at $DASH_VERSION but packages/cli is at $PKG_VERSION"
            exit 1
          fi

      # Release notes lead with the human-written changeset entries for this
      # version; GitHub's generated commit notes are appended after the body.
      # A tag whose version has no changelog entry means `changeset version`
      # was skipped — fail HERE, before publish, so the bad version never
      # reaches the registry.
      - name: Extract changelog entry for release notes
        run: |
          set -euo pipefail
          mkdir -p work/release
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          awk -v ver="$VERSION" '
            $0 == "## " ver { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' packages/cli/CHANGELOG.md > work/release/release-notes.md
          if ! grep -q '[^[:space:]]' work/release/release-notes.md; then
            echo "::error::packages/cli/CHANGELOG.md has no entry for $VERSION — run bunx changeset version before tagging"
            exit 1
          fi

      - name: Install pinned release scanner
        # SkillSpector v2.11.2 immutable commit 69dcdfb74487d361ba4c811d088cfdea2ff3a9dc, with one hash-locked runtime/build graph.
        run: |
          set -euo pipefail
          uv venv --python 3.12 work/release-scanner/venv
          grep -v '^skillspector @' .github/skillspector-release-constraints.txt > work/release-scanner/dependencies.txt
          uv pip sync --python work/release-scanner/venv/bin/python --require-hashes work/release-scanner/dependencies.txt
          uv pip install --python work/release-scanner/venv/bin/python --no-deps --no-build-isolation 'git+https://github.com/NVIDIA/skillspector.git@69dcdfb74487d361ba4c811d088cfdea2ff3a9dc'
          work/release-scanner/venv/bin/python - <<'PY'
          import importlib.metadata, json
          distribution = importlib.metadata.distribution("skillspector")
          direct = json.loads(distribution.read_text("direct_url.json"))
          assert distribution.version == "2.11.2"
          assert direct["vcs_info"]["commit_id"] == "69dcdfb74487d361ba4c811d088cfdea2ff3a9dc"
          PY
          echo "$GITHUB_WORKSPACE/work/release-scanner/venv/bin" >> "$GITHUB_PATH"

      - name: Prepare and smoke immutable artifact pair
        run: node scripts/release-artifacts.mjs prepare work/release "$GITHUB_REF_NAME"

      - name: Verify finalized immutable pair and evidence
        run: node scripts/release-artifacts.mjs verify-release work/release/release-manifest.json

      # Upload success is required BEFORE the first possible registry mutation.
      - name: Retain finalized immutable pair
        id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-pair-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: work/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: prepare
    permissions:
      contents: read
      actions: read
      id-token: write
    # npm trusted publishing accepts OIDC only from supported hosted runners.
    runs-on: ubuntu-latest
    outputs:
      outcome-name: release-outcome-${{ github.sha }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # The dashboard's traced server uses bun:sqlite at runtime. Preparation has the same
      # pinned Bun, and hosted first-use smoke must run with that declared runtime too.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Restore prepared immutable pair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.pair-name }}
          path: work/release/

      - name: Verify retained pair before publication authority is used
        run: node scripts/release-artifacts.mjs verify-release work/release/release-manifest.json

      # Direct latest publication is covered only by the operator-authorized release tag.
      # Hosted OIDC supplies short-lived publication authority. The publisher currently opts out
      # of npm provenance explicitly; removing that opt-out is a separate verified change.
      - name: Publish retained pair directly as latest and verify registry first use
        env:
          VEGAFACTORY_RETAINED_PAIR_ID: ${{ needs.prepare.outputs.pair-id }}
        run: node scripts/release-publish.mjs work/release/release-manifest.json --publish

      - name: Verify release assets before exposing success
        run: node scripts/release-artifacts.mjs verify-release work/release/release-manifest.json

      - name: Retain attempt outcome and failure diagnosis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-outcome-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: work/release/
          retention-days: 90

  release:
    needs: publish
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Restore verified publication outcome
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.publish.outputs.outcome-name }}
          path: work/release/

      - name: Create GitHub release after direct latest publication
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: work/release/*
          body_path: work/release/release-notes.md
          generate_release_notes: true
